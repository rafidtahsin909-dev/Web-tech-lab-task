<!DOCTYPE html>
<html>
    <head>
        <title>Campus Club membership</title>
        
    </head>
    <body>
        <style>
            
            h1{
                text-align: center;
                background-color:bisque;
            }
            .topnav{
                background-color: #333;
                display: block;
                width: 100%;
                overflow: hidden;
                float:left;
                list-style-type: none;
                margin: 0;
                padding: 14px 16px;
                position:fixed;
                }

            .topnav a:hover{
                color: aqua;


            }
            .card{
                width: 400px;
                padding: 2px;
                border:10px;
                display: block;
                justify-content: center;
                }

        </style>
        <h1>Programming Club</h1>
        <div class="topnav">
            <a href="home.html"> Home </a>
            <a href="event.html"> Event </a>
            <a href="join.html"> Join</a>
        </div>
        <div class="card">
            <h2>Club membership</h2>
            <p>join the programming club</p>
            <span class="badge">New</span>
        <form action="form submitted.html" method="post">
            <fieldset>
                <legend>Join the club</legend>
                <label for="name">Full name:</label>
                <input type="text" id="name" name="name" pattern=".{3,}" required><br>
                <label for="email">E-mail:</label>
                <input type="email" id="email" email="email"><br>
                <label for="id">Student Id:</label>
                <input type="id" id="id" id="id" value="24-56789-1" pattern="[0-9]{2}-[0-9]{5}-[0-9]{1}"><br>
                <label for="age">Age:</label>
                <input type="age" id="age" age="age" required><br>
                <label for="">Full name:</label>
                <input type="text" id="name" name="name"><br>
                <label for="membershiptype">Membership Type:</label>
                <select id="membershiptype" name="membershiptype">
                    <option value="genarel">Genarel</option>
                    <option value="executive">Executive</option>
                </select><br>
                <label for="prefferedclub">Preffered Club</label>
                <select name="prefferedclub" id="prefferedclub" required>
                    <option value="Default">Select A Club</option>
                    <option value="programming">Programming</option>
                    <option value="debating">Debating</option>
                    <option value="robotics">Robotics</option>
                </select><br>
                <label for="text">Why wouldnot You joined?</label><br>
                <textarea name="text" id="text" pattern="{200,}"></textarea>
                <input type="checkbox" id="rules">
                <label for="rules"> I agreed to the club</label><br>
                <button>Join now</button>
            </fieldset>
        </form>
        </div>


    </body>
</html>
